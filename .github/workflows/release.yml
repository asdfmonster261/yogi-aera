# Build AERA for the Pixel 11 (malibu) family and publish the three release assets.
# Manually triggered: a release is a decision, and main3 builds this in about 7 minutes
# against a couple of hours here. What CI buys is that what people flash came from what is
# pushed.
#
# The assets:
#   AERA-R1.0-malibu-unassembled.img  AERA's raw two-fragment vendor_boot. NOT flashable on
#                                     its own; create-aera-malibu.sh grafts it onto the
#                                     user's own first-stage.
#   AERA-R1.0-malibu.zip              AnyKernel3 repack zip; grafts on device instead.
#   create-aera-malibu.sh             the no-root client path.
# Grafting stays on the client on purpose: a CI-grafted image would be pinned to whatever
# build CI happened to fetch, which is the staleness the client-side graft exists to avoid.
name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: tag to publish under (leave blank to build and attach artifacts only)
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Check out the device tree
        uses: actions/checkout@v7
        with:
          path: devicetree

      # Required, not headroom: the sync peaks near 77 GB (59 GB of checkout plus about
      # 18 GB of git objects), and an uncleaned runner leaves about 58 GB free.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift /opt/az
          sudo docker image prune -af || true
          df -h / | tail -1

      # AERA's scripts invoke a bare `python`, which a runner does not provide at all.
      # 3.11 is what main3 builds it with.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install the build dependencies
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          sudo apt-get -qq update
          sudo apt-get -qq install -y bc bison build-essential ccache flex g++-multilib \
            gcc-multilib git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3-pip openjdk-17-jdk
          python --version

      # The manifest fetches AERA's own repositories over ssh://git@github.com, which needs a
      # key. They are public, so they come over HTTPS instead.
      - name: Sync the AERA tree
        env:
          MANIFEST: https://github.com/AERA-Recovery/android_manifest
          BRANCH: aera-16.0
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global url."https://github.com/AERA-Recovery/".insteadOf "ssh://git@github.com/AERA-Recovery/"
          mkdir -p /home/runner/aera
          cd /home/runner/aera
          repo init --depth=1 -u "$MANIFEST" -b "$BRANCH"
          repo sync --force-sync -c -j8 --no-clone-bundle --no-tags
          df -h / | tail -1

      # The build needs the checkout, not its git history, and dropping .repo is what makes
      # room for the swap below. The exception is bootable/recovery, whose git log stamps
      # AERA's version string, so it gets a standalone copy first. build.sh only runs repo
      # when gflags or guava are missing.
      - name: Drop the git history
        working-directory: /home/runner/aera
        run: |
          test -f external/gflags/Android.bp
          test -f external/guava/Android.bp
          gitdir=$(git -C bootable/recovery rev-parse --absolute-git-dir)
          cp -rL "$gitdir" bootable/recovery/.git.new
          rm -rf bootable/recovery/.git
          mv bootable/recovery/.git.new bootable/recovery/.git
          du -sh .repo
          rm -rf .repo
          git -C bootable/recovery log -1 --format='%ad (%h)' --date=short
          df -h / | tail -1

      - name: Overlay our device tree
        run: |
          mkdir -p /home/runner/aera/device/google/pixels
          rsync -a --delete --exclude .git --exclude .github \
            "$GITHUB_WORKSPACE/devicetree/" /home/runner/aera/device/google/pixels/
          test -f /home/runner/aera/device/google/pixels/build.sh

      # Soong's analysis peaked at 28 GB on main3, against 16 GB of RAM here.
      - name: Add swap
        run: |
          sudo fallocate -l 32G /swap.img
          sudo chmod 600 /swap.img
          sudo mkswap /swap.img
          sudo swapon /swap.img
          free -g | head -3
          df -h / | tail -1

      # No -j: build.sh already defaults JOBS to nproc.
      - name: Build
        working-directory: /home/runner/aera
        run: bash device/google/pixels/build.sh --family malibu

      # build.sh names its output after AERA's version and the family, but the asset names
      # are fixed: create-aera-malibu.sh downloads
      # releases/latest/download/AERA-R1.0-malibu-unassembled.img, so renaming it breaks the
      # no-root install path for everyone.
      - name: Collect the three assets
        run: |
          mkdir -p out
          raw=$(ls /home/runner/aera/builds/AERA-*-malibu.img)
          [ "$(printf '%s\n' "$raw" | wc -l)" = 1 ] || { echo "expected one raw image, got:"; echo "$raw"; exit 1; }
          cp "$raw" out/AERA-R1.0-malibu-unassembled.img
          bash "$GITHUB_WORKSPACE/devicetree/aera-ak3/build-aera-ak3.sh" \
            out/AERA-R1.0-malibu-unassembled.img out/AERA-R1.0-malibu.zip
          cp "$GITHUB_WORKSPACE/devicetree/create-aera-malibu.sh" out/
          ls -l out/

      # The raw image is two fragments and must stay that way: an assembled image here
      # would be pinned to CI's stock boot, and build-aera-ak3.sh would reject it anyway.
      - name: Sanity-check the assets
        run: |
          test "$(stat -c%s out/AERA-R1.0-malibu-unassembled.img)" -gt 33554432
          unzip -l out/AERA-R1.0-malibu.zip | grep -q anykernel.sh
          unzip -l out/AERA-R1.0-malibu.zip | grep -q 'tools/magiskboot'
          head -1 out/create-aera-malibu.sh | grep -q '^#!'

      - uses: actions/upload-artifact@v7
        with:
          name: AERA-R1.0-malibu
          path: out/*
          if-no-files-found: error

      # Not --prerelease, despite the Beta in the title: releases/latest skips prereleases,
      # and create-aera-malibu.sh downloads from there.
      - name: Publish
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'MD'
          AERA Recovery R1.0 Beta for the Pixel 11 family.

          | file | use |
          |---|---|
          | `AERA-R1.0-malibu.zip` | Flash from KernelFlasher or a custom recovery; in AERA itself, by adb sideload. Grafts onto your own vendor_boot on device, so one zip works on any build. |
          | `create-aera-malibu.sh` | First install with no root and no custom recovery. Run it on a PC or in Termux; it fetches the image below and grafts it against your own stock vendor_boot. |
          | `AERA-R1.0-malibu-unassembled.img` | Downloaded by the script above. NOT flashable on its own. |

          Hardware-tested on yogi.

          Format Data erases the phone the way a stock factory reset does, and Android sets up /data again on its next boot.
          MD
          # The checkout is in devicetree/, so gh cannot find the repository from here.
          gh release create "${{ inputs.release_tag }}" out/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "AERA R1.0 Beta (malibu)" --notes-file notes.md
